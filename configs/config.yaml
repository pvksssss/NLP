# Training Configuration for Multilingual NMT with mBART-50
# ==========================================================

model:
  name: "facebook/mbart-large-50-many-to-many-mmt"
  cache_dir: null

data:
  # Language pairs to train on
  # Format: (dataset_config, source_lang, target_lang)
  lang_pairs:
    - ["en-vi", "en", "vi"]  # English -> Vietnamese
    - ["en-fr", "en", "fr"]  # English -> French
    - ["de-en", "de", "en"]  # German -> English
  
  max_samples_per_pair: 50000
  max_length: 128
  val_size: 1000
  test_size: 2000

training:
  num_train_epochs: 2
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  learning_rate: 3e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  optim: "adamw_torch"
  
  # Gradient accumulation
  gradient_accumulation_steps: 1
  
  # Mixed precision
  fp16: true
  
  # Logging
  logging_steps: 500
  eval_strategy: "epoch"
  
  # Saving
  save_strategy: "epoch"
  save_total_limit: 1
  
  # Evaluation
  predict_with_generate: true
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false

output:
  output_dir: "./mbart50-multilingual"
  logging_dir: "./outputs/logs"
  report_to: "none"  # Set to "wandb" for wandb integration

generation:
  max_length: 128
  num_beams: 4
  temperature: 1.0
  do_sample: false

seed: 42
